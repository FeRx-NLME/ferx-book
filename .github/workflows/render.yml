name: Render and deploy ferx book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, book/v2-workflow]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Pinned ferx-r build the book documents. Must match ferx_r_sha in
      # _variables.yml (checked by tools/audit.R).
      FERX_R_SHA: 67357e8a050019f61de083d75aa450a9e137bad1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages('pak', repos = 'https://r-lib.github.io/p/pak/stable/')"
          Rscript -e "pak::pkg_install(c('rmarkdown', 'knitr', 'ggplot2', 'dplyr', 'tidyr', 'patchwork', 'gt', 'survival', 'yaml', 'downlit', 'xml2', paste0('FeRx-NLME/ferx-r@', Sys.getenv('FERX_R_SHA'))))"

      - name: Audit chapters against the pinned build
        run: Rscript tools/audit.R --strict

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          cname: ""
