project:
  type: book
  output-dir: _book

brand: _brand.yml

book:
  title: "FeRx NLME - R package (ferx)"
  site-url: https://ferx-nlme.github.io/ferx-book/
  repo-url: https://github.com/FeRx-NLME/ferx-book
  repo-actions: [edit, issue]
  favicon: assets/ferx-favicon.svg

  navbar:
    logo: assets/ferx-dsl-brackets.svg
    logo-dark: assets/ferx-dsl-brackets-dark.svg
    logo-alt: "ferx"
    left:
      - text: "Get started"
        href: https://ferx-nlme.github.io/get-started.html
      - text: "Features"
        href: https://ferx-nlme.github.io/features.html
      - text: "Changelog"
        href: https://ferx-nlme.github.io/changelog.html
      - text: "Roadmap"
        href: https://ferx-nlme.github.io/roadmap.html
    right:
      - text: "ferx-core"
        href: https://ferx-nlme.github.io/ferx-core/
      - text: "ferx-r"
        href: https://ferx-nlme.github.io/ferx-book/
      - text: "Reference"
        href: https://ferx-nlme.github.io/reference/
      - icon: github
        href: https://github.com/FeRx-NLME
        aria-label: GitHub

  # Structure and chapter homes: PLAN.md §5 and tools/homes.csv.
  chapters:
    - index.qmd
    - part: "Getting started"
      chapters:
        - chapters/01-installation.qmd
        - chapters/02-complete-analysis.qmd
    - part: "The analysis workflow"
      chapters:
        - chapters/03-data.qmd
        - chapters/04-model-files.qmd
        - chapters/05-first-fit.qmd
        - chapters/06-estimation-methods.qmd
        - chapters/07-diagnostics.qmd
        - chapters/08-vpc.qmd
        - chapters/09-model-selection.qmd
        - chapters/10-uncertainty.qmd
        - chapters/11-simulation.qmd
        - chapters/12-tables-figures.qmd
        - chapters/13-reproducibility.qmd
    - part: "Scenarios: general PK modeling"
      chapters:
        - chapters/14-structural-models.qmd
        - chapters/15-absorption.qmd
        - chapters/16-variability.qmd
    - part: "Scenarios: covariates"
      chapters:
        - chapters/17-covariates.qmd
    - part: "Scenarios: dosing and data"
      chapters:
        - chapters/18-dosing.qmd
        - chapters/19-censoring.qmd
    - part: "Scenarios: endpoints beyond PK"
      chapters:
        - chapters/20-pkpd.qmd
        - chapters/21-binary.qmd
        - chapters/22-time-to-event.qmd
    - part: "Scenarios: adaptive dosing"
      chapters:
        - chapters/23-adaptive-dosing.qmd
    - part: "Scenarios: experimental"
      chapters:
        - chapters/24-experimental.qmd
    - part: "Reference"
      chapters:
        - chapters/25-reference.qmd

format:
  html:
    theme:
      light: [cosmo, assets/ferx.scss]
      dark: [cosmo, assets/ferx-dark.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-link: true
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: github
      dark: github-dark
    mainfont: "IBM Plex Sans"
    monofont: "JetBrains Mono"

execute:
  freeze: false
  cache: true
